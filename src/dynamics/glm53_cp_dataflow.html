<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLM-5.3-Flash · PCP &amp; DCP 动态算子 Tensor 数据流</title>
  <style>
    :root {
      --bg: #061019;
      --panel: #0b1824;
      --stroke: #264258;
      --text: #eef7fc;
      --muted: #8aa4b7;
      --cyan: #36d8d2;
      --blue: #58aaff;
      --violet: #b388ff;
      --amber: #ffc066;
      --green: #62d993;
      --pink: #ff73aa;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Inter, "Microsoft YaHei", sans-serif;
    }
    .shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .toolbar {
      height: 42px;
      flex: 0 0 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--stroke);
      gap: 8px;
      overflow-x: auto;
    }
    .shell.compact-mode .toolbar {
      height: 36px;
      flex: 0 0 36px;
      padding: 0 10px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .group-label {
      font-size: 11px;
      color: var(--muted);
      margin-right: 2px;
      font-weight: 700;
      white-space: nowrap;
    }
    .toolbar button {
      font: 600 11.5px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #102230;
      color: #b5cfdf;
      border: 1px solid #335267;
      border-radius: 5px;
      padding: 4px 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
    }
    .toolbar button:hover {
      border-color: var(--cyan);
      color: #fff;
    }
    .toolbar button[aria-pressed="true"] {
      background: #10323c;
      border-color: var(--cyan);
      color: #5ef0e6;
      box-shadow: 0 0 10px rgba(54, 216, 210, 0.22);
    }
    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 148px;
      gap: 6px;
      padding: 6px 8px 7px;
    }
    .shell.compact-mode .stage-wrap {
      grid-template-rows: 1fr 118px;
      gap: 5px;
      padding: 5px 7px 6px;
    }
    .canvas-box {
      position: relative;
      background:
        radial-gradient(circle at 14% 0%, #102a3d 0%, transparent 38%),
        radial-gradient(circle at 86% 100%, #122338 0%, transparent 38%),
        var(--bg);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .df-zone {
      fill: rgba(16, 36, 52, 0.42);
      stroke: #294860;
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
      rx: 10;
    }
    .df-zone-label {
      font: 700 10.5px "Segoe UI", "Microsoft YaHei", sans-serif;
      fill: #78a3c0;
      letter-spacing: 0.6px;
    }
    .df-node { cursor: pointer; }
    .df-node > rect.node-box {
      fill: #102437;
      stroke: #497293;
      stroke-width: 1.5;
      transition: stroke 0.14s, fill 0.14s;
    }
    .df-node.collective > rect.node-box {
      fill: #0d2821;
      stroke: var(--green);
      stroke-width: 1.85;
    }
    .df-node.cache > rect.node-box {
      fill: #1f1b34;
      stroke: var(--violet);
      stroke-width: 1.75;
    }
    .df-node.boundary > rect.node-box {
      fill: #0d2930;
      stroke: var(--cyan);
      stroke-width: 1.75;
    }
    .df-node.index > rect.node-box {
      fill: #2a2114;
      stroke: var(--amber);
      stroke-width: 1.75;
    }
    .df-node:hover > rect.node-box,
    .df-node.selected > rect.node-box {
      stroke: #ffe0a0;
      stroke-width: 2.5;
      fill: #19364d;
    }
    .df-port {
      stroke: #061019;
      stroke-width: 1.3;
      pointer-events: none;
    }
    .df-body {
      height: 100%;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #e4f3fa;
      pointer-events: none;
    }
    .df-body .role-tag {
      font-size: 8.8px;
      font-weight: 800;
      letter-spacing: 0.45px;
      color: #84e6e0;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .df-body strong {
      font-size: 12.2px;
      line-height: 1.15;
      color: #ffffff;
    }
    .df-body code {
      font: 10.2px/1.18 Consolas, monospace;
      color: #a4cae4;
      margin-top: 3px;
    }
    .df-halo {
      fill: none;
      stroke: var(--bg);
      stroke-width: 5.5;
      pointer-events: none;
    }
    .df-wire {
      fill: none;
      stroke-width: 1.9;
      stroke-linejoin: round;
      cursor: pointer;
    }
    .df-flow-anim {
      fill: none;
      stroke-width: 2.2;
      stroke-dasharray: 6 14;
      animation: flowDash 1.15s linear infinite;
      pointer-events: none;
      opacity: 0.88;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -20; }
    }
    .df-label { cursor: pointer; }
    .df-label rect {
      fill: #081520;
      stroke: #38586e;
      stroke-width: 0.95;
      rx: 4;
    }
    .df-label text {
      font: 600 10.2px Consolas, "Microsoft YaHei", monospace;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .df-label:hover rect,
    .df-label.selected rect {
      stroke: #ffe0a0;
      stroke-width: 1.65;
      fill: #142d40;
    }
    .df-muted { opacity: 0.16 !important; }
    .df-node.df-muted { opacity: 0.28 !important; }

    /* Bottom Inspector Panel */
    .df-detail {
      border: 1px solid #325065;
      border-radius: 8px;
      background: #0a1925;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-height: 0;
    }
    .df-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid #1d3547;
      padding-bottom: 4px;
    }
    .df-detail-head strong {
      font-size: 13px;
      color: #ffe0a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .df-detail-head .code-jump-btn {
      background: #133540;
      border: 1px solid #36d8d2;
      color: #72f2eb;
      border-radius: 4px;
      padding: 2px 9px;
      font: 600 11px Consolas, monospace;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .df-detail-head .code-jump-btn:hover {
      background: #1b4b5a;
      color: #fff;
    }
    .df-cols {
      display: grid;
      grid-template-columns: 1.1fr 1.15fr 1.15fr 1.55fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
      font-size: 11px;
    }
    .df-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid #1a3142;
      padding-right: 8px;
    }
    .df-col:last-child {
      border-right: none;
      padding-right: 0;
    }
    .df-col b {
      color: #72e5d9;
      font-size: 10.2px;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .df-col-body {
      overflow-y: auto;
      font: 10.6px/1.38 Consolas, "Microsoft YaHei", monospace;
      color: #c5dbe9;
    }
    .df-item { margin-bottom: 2px; }
    .df-item span { color: #ffe0a0; font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell" id="app-shell">
    <nav class="toolbar" aria-label="GLM-5.3-Flash 算子流切换栏">
      <div class="btn-group">

            🔵 Activation 激活流 &nbsp;&nbsp; 🟢 HCCL 集合通信 &nbsp;&nbsp; 🟣 KV / KPool / SSM State &nbsp;&nbsp; 🟠 Top-K 稀疏索引 / Gate &nbsp;&nbsp; 🩷 Slot / BlockTable 元数据

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const KIND_COLOR = {
      act: "#58aaff",
      comm: "#62d993",
      cache: "#b388ff",
      index: "#ffc066",
      meta: "#ff73aa"
    };

    const params = new URLSearchParams(window.location.search);
    if (params.get("compact") === "1") {
      document.getElementById("app-shell").classList.add("compact-mode");
    }

    let currentScene = params.get("scene") || "pcp_prefill";
    let currentSnippet = "code-glm53-kda-pcp";

    function svgEl(tag, attrs = {}, text) {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function buildSceneGraph(scene) {
      switch (scene) {
        /* =====================================================================
         * 1. DCP ①: GLM-5.3-Flash DCP Prefill & Virtual Block Interleave Slot Mapping
         * ===================================================================== */
        case "dcp_prefill":
          return {
            title: "GLM-5.3-Flash · DCP Prefill 异构 Cache 映射与交错落盘 (DCP=4, I=block_size=128)",
            subtitle: "同一套 MultiGroupBlockTable 按 dcp_sharded: list[bool] 驱动 5 个异构 Cache Group：只有 Group 0 SFA 主 KV 按 DCP 交错切分",
            snippet: "code-slot-mapping-kernel",
            zones: [
              { x: 20, y: 65, w: 460, h: 455, label: "STAGE 1 · MRV2 虚拟块表与 GLM-5.3 入口" },
              { x: 500, y: 65, w: 505, h: 455, label: "STAGE 2 · 34层 KDA 状态 vs 11层 KPool 复制落盘 (dcp_sharded=False)" },
              { x: 1025, y: 65, w: 515, h: 455, label: "STAGE 3 · 11层 NoPE SFA 交错切分与 Prefill 注意力 (dcp_sharded=True)" }
            ],
            nodes: [
              { id: "dp_in", x: 38, y: 120, w: 200, h: 86, kind: "boundary", role: "GLM-5.3 BACKBONE IN", title: "Replicated Prefill Batch", kernel: "hidden [T, 4096], pos [T]", weight: "hc_expand → [T, 4, 4096] 4条残差流", math: "纯 DCP (PCP=1) 下，每个 Rank 接收相同 Prefill Token 序列 [T, 4096]，由 DCP 负责切分 KV Cache 显存。", snippet: "code-slot-mapping-kernel" },
              { id: "dp_bt", x: 38, y: 310, w: 200, h: 92, kind: "index", role: "MULTI-GROUP BLOCK TABLE", title: "Virtual Block Allocator", kernel: "VBlock = 128 × DCP4 = 512", weight: "dcp_sharded = [True, False, False, False, False]", math: "Scheduler 按 virtual_block_size=512 分配逻辑块；Worker 侧 compute_slot_mappings_kernel 按 Group 独立生成物理 Slot。", snippet: "code-slot-mapping-kernel" },
              { id: "dp_qkv", x: 268, y: 120, w: 195, h: 86, kind: "normal", role: "SFA L0-44 ENTRY", title: "fused_qkv_a_proj", kernel: "q_c [1536] + kv_a [512]", weight: "fused_qkv_a_proj [2048, 4096] (RoPE=0)", math: "GLM-5.3-Flash 采用 NoPE SFA (rope_dim=0)，一次投影产出 q_c [T, 1536] 与 Latent KV [T, 512]。", snippet: "code-sfa-dcp-impl" },
              { id: "dp_slot_k", x: 268, y: 310, w: 195, h: 92, kind: "collective", role: "TRITON SLOT KERNEL", title: "compute_slot_mappings", kernel: "owner = (pos // 128) % 4", weight: "PAD_SLOT_ID = -1 (非 Owner 掩码)", math: "target_dcp_rank = ((pos % 512) // 128) % 4。属于本 Rank 的 Token 获得物理 Slot，其余位置写 -1 跳过落盘！", snippet: "code-slot-mapping-kernel" },
              { id: "dp_kda", x: 525, y: 105, w: 220, h: 88, kind: "cache", role: "GROUP 2~4 (34 LAYERS)", title: "KDA Conv & SSM State", kernel: "dcp_sharded = False", weight: "Conv [B, 3, 3*n*128], SSM [B, n, 128, 128]", math: "34 层 KDA 线性注意力状态按 请求槽位 (Request Slot) 索引，不随 Token 长度增长，按 TP×PCP 切分 Heads。", snippet: "code-glm53-kda-pcp" },
              { id: "dp_kpool", x: 525, y: 235, w: 220, h: 88, kind: "cache", role: "GROUP 0/1 (11 LAYERS)", title: "KPool (4:1) & Tail Ring", kernel: "Replicated Indexer Cache", weight: "KPool [Pools, 128], Tail [2, Ring, 128] FP32", math: "wk_weights_proj 产出 Key [T, 128] 与 32 头权重，经 cann.key_pool 4:1 压缩后在所有 DCP Rank 全量复制写入。", snippet: "code-glm53-kpool-pcp" },
              { id: "dp_topk", x: 768, y: 235, w: 215, h: 88, kind: "index", role: "SPARSE INDEXER", title: "pool_key_indexer", kernel: "Top-2048 + Causal Tail(3)", weight: "wq_b [4096, 1536] (32 heads × 128)", math: "因 Replicated Indexer Cache 拥有完整序列视图，各 DCP Rank 独立打分选出完全一致的全局 Top-2051 稀疏索引！", snippet: "code-glm53-kpool-pcp" },
              { id: "dp_sfa_w", x: 768, y: 390, w: 215, h: 88, kind: "cache", role: "GROUP 0 SFA MAIN KV", title: "reshape_and_cache_sfa", kernel: "Write Owned 1/4 Tokens", weight: "SFA Cache [num_blocks, 128, 1, 512]", math: "仅 slot_mapping >= 0 的 1/4 Token 真正写入本卡 HBM，单卡主 KV 显存占用直接降至 1/DCP (25%)！", snippet: "code-sfa-dcp-impl" },
              { id: "dp_gather", x: 1050, y: 390, w: 225, h: 88, kind: "collective", role: "ON_KV_CACHE_WRITTEN", title: "_record_dcp_kv_gather", kernel: "Compact Block AllGather", weight: "kv_gather_block_ids [num_compact_blocks]", math: "写完本层 KV 后，按紧凑 Block Table 将本步被引用的虚拟块跨 DCP AllGather 还原为连续 Latent KV 供 Prefill 消费。", snippet: "code-sfa-dcp-impl" },
              { id: "dp_attn", x: 1050, y: 205, w: 225, h: 90, kind: "cache", role: "CANN SPARSE ATTN", title: "npu_sparse_flash_attn", kernel: "Q [T, 64/TP, 512] × Top2051", weight: "q_b_proj + W_UK_T 吸收 → D=512", math: "Query 吸收 W_UK_T 至 512 维 Latent 空间，根据 Top-2051 索引从聚合后的紧凑 KV 中读取对应 Token 完成注意力。", snippet: "code-sfa-dcp-impl" },
              { id: "dp_out", x: 1300, y: 205, w: 220, h: 90, kind: "boundary", role: "SFA OUTPUT & MOE", title: "W_UV + o_proj + MoE", kernel: "out [T, 4096] → HC_post", weight: "W_UV [64/TP, 512, 256], o_proj [4096, 16384]", math: "乘 W_UV 投影回 v_head_dim=256，经 o_proj 写回 4 条 mHC 残差流，随后进入 288 专家 EP MoE。", snippet: "code-sfa-dcp-impl" }
            ],
            edges: [
              { id: "e1", src: "dp_in", dst: "dp_qkv", kind: "act", text: "normed [T, 4096]", path: [[238,163],[268,163]], lx: 253, ly: 140, detail: "HC_pre 归一化后的层输入" },
              { id: "e2", src: "dp_in", dst: "dp_kda", kind: "act", text: "34层 KDA: [T, 4096]", path: [[138,120],[138,90],[635,90],[635,105]], lx: 385, ly: 82, detail: "34 层 KDA 直接在完整序列上推进 SSM 状态" },
              { id: "e3", src: "dp_bt", dst: "dp_slot_k", kind: "meta", text: "vblock_table + pos [T]", path: [[238,356],[268,356]], lx: 253, ly: 334, detail: "逻辑块表与 Token 位置送入 Triton Slot Mapping Kernel" },
              { id: "e4", src: "dp_slot_k", dst: "dp_kpool", kind: "meta", text: "full_slots [T] (Replicated)", path: [[463,335],[495,335],[495,279],[525,279]], lx: 495, ly: 310, detail: "dcp_sharded=False: 所有 Rank 生成完整有效 Slot" },
              { id: "e5", src: "dp_slot_k", dst: "dp_sfa_w", kind: "meta", text: "dcp_slots [T] (3/4 为 -1)", path: [[463,375],[495,375],[495,434],[768,434]], lx: 615, ly: 452, detail: "dcp_sharded=True: 仅 (pos//128)%4 == rank 保留物理 Slot" },
              { id: "e6", src: "dp_qkv", dst: "dp_kpool", kind: "act", text: "k_hidden [T, 4096]", path: [[463,163],[495,163],[495,260],[525,260]], lx: 492, ly: 205, detail: "送入 wk_weights_proj 压缩写入 KPool" },
              { id: "e7", src: "dp_kpool", dst: "dp_topk", kind: "cache", text: "KPool + Tail Cache", path: [[745,279],[768,279]], lx: 756, ly: 256, detail: "全量复制的 4:1 压缩索引缓存" },
              { id: "e8", src: "dp_qkv", dst: "dp_topk", kind: "act", text: "q_c [T, 1536] → wq_b", path: [[463,145],[875,145],[875,235]], lx: 685, ly: 132, detail: "Query 低秩激活投影为 [T, 32, 128] 参与 KPool 打分" },

    function selectItem(graph, kind, id) {
      const edges = kind === "node"
        ? graph.edges.filter(e => e.src === id || e.dst === id)
        : kind === "edge"
          ? graph.edges.filter(e => e.id === id)
          : graph.edges;
      const activeEdgeIds = new Set(edges.map(e => e.id));
      const activeNodeIds = new Set(edges.flatMap(e => [e.src, e.dst]));
      if (kind === "node") activeNodeIds.add(id);

      document.querySelectorAll("#g-wires > g").forEach(g => {
        g.classList.toggle("df-muted", Boolean(kind) && !activeEdgeIds.has(g.dataset.edgeId));
      });
      document.querySelectorAll("#g-labels > g").forEach(g => {
        const match = activeEdgeIds.has(g.dataset.edgeId);
        g.classList.toggle("df-muted", Boolean(kind) && !match);
        g.classList.toggle("selected", Boolean(kind) && match);
      });
      document.querySelectorAll("#g-nodes > g").forEach(g => {
        g.classList.toggle("df-muted", Boolean(kind) && !activeNodeIds.has(g.dataset.nodeId));
        g.classList.toggle("selected", kind === "node" && g.dataset.nodeId === id);
      });

      const node = kind === "node"
        ? graph.nodes.find(n => n.id === id)
        : kind === "edge"
          ? graph.nodes.find(n => n.id === edges[0].src)
          : graph.nodes[0];

      currentSnippet = node?.snippet || graph.snippet;
      document.getElementById("det-title").textContent = kind
        ? `${node.title} · ${node.kernel}`
        : `${graph.title}`;
      document.getElementById("det-note").textContent = kind === "edge"
        ? `当前连线: ${edges[0].text} — ${edges[0].detail}`
        : "提示：点击上方任意算子框或彩色 Tensor 标签可高亮其上下游依赖并查看源码";

      document.getElementById("col-weights").innerHTML = `<div class="df-item"><span>规格/契约：</span>${node.weight}</div>`;

      const inEdges = graph.edges.filter(e => e.dst === node.id);
      document.getElementById("col-inputs").innerHTML = inEdges.length
        ? inEdges.map(e => `<div class="df-item"><span>${e.src} &#8594;</span> ${e.text}<br><small style="color:#8ea7b9">${e.detail}</small></div>`).join("")
        : `<div class="df-item"><span>入口边界：</span>来自 Runner / 上一层 mHC 残差流</div>`;

      const outEdges = graph.edges.filter(e => e.src === node.id);
      document.getElementById("col-outputs").innerHTML = outEdges.length
        ? outEdges.map(e => `<div class="df-item"><span>&#8594; ${e.dst}:</span> ${e.text}<br><small style="color:#8ea7b9">${e.detail}</small></div>`).join("")
        : `<div class="df-item"><span>出口边界：</span>写回 mHC 残差流或传出至下一阶段</div>`;

      document.getElementById("col-math").innerHTML = `<div class="df-item">${node.math}</div>`;
    }

    function renderGraph() {
      const graph = buildSceneGraph(currentScene);
      document.getElementById("svg-title").textContent = graph.title;
      document.getElementById("svg-sub").textContent = graph.subtitle;

      document.querySelectorAll("[data-scene]").forEach(b => {
        b.setAttribute("aria-pressed", String(b.dataset.scene === currentScene));
      });

      const gZones = document.getElementById("g-zones");
      const gWires = document.getElementById("g-wires");
      const gLabels = document.getElementById("g-labels");
      const gNodes = document.getElementById("g-nodes");
      gZones.replaceChildren();
      gWires.replaceChildren();
      gLabels.replaceChildren();
      gNodes.replaceChildren();

      // Render background stage zones
      (graph.zones || []).forEach(z => {
        const zg = svgEl("g");
        zg.append(
          svgEl("rect", { x: z.x, y: z.y, width: z.w, height: z.h, class: "df-zone" }),
          svgEl("text", { x: z.x + 12, y: z.y + 18, class: "df-zone-label" }, z.label)
        );
        gZones.append(zg);
      });

      // Render edges & port dots
      graph.edges.forEach(e => {
        const color = KIND_COLOR[e.kind] || "#58aaff";
        const d = e.path.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join(" ");
        const grp = svgEl("g", { "data-edge-id": e.id });
        const halo = svgEl("path", { d, class: "df-halo" });
        const wire = svgEl("path", {
          d,
          class: "df-wire",
          stroke: color,
          "marker-end": `url(#arrow-${e.kind})`
        });
        const anim = svgEl("path", {
          d,
          class: "df-flow-anim",
          stroke: "#ffffff"
        });
        const pStart = e.path[0];
        const pEnd = e.path[e.path.length - 1];
        const dotStart = svgEl("circle", { cx: pStart[0], cy: pStart[1], r: 3.6, fill: color, class: "df-port" });
        const dotEnd = svgEl("circle", { cx: pEnd[0], cy: pEnd[1], r: 3.6, fill: color, class: "df-port" });

        wire.addEventListener("click", () => selectItem(graph, "edge", e.id));
        grp.append(halo, wire, anim, dotStart, dotEnd);
        gWires.append(grp);

        const w = Math.max(112, e.text.length * 6.9 + 16);
        const h = 21;
        const lbl = svgEl("g", { class: "df-label", "data-edge-id": e.id });
        lbl.append(
          svgEl("rect", { x: e.lx - w / 2, y: e.ly - h / 2, width: w, height: h }),
          svgEl("text", { x: e.lx, y: e.ly, fill: color }, e.text)
        );
        lbl.addEventListener("click", () => selectItem(graph, "edge", e.id));
        gLabels.append(lbl);
      });

      // Render nodes
      graph.nodes.forEach(n => {
        const grp = svgEl("g", { class: `df-node ${n.kind}`, "data-node-id": n.id });
        grp.append(svgEl("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 8, class: "node-box" }));
        const fo = svgEl("foreignObject", { x: n.x, y: n.y, width: n.w, height: n.h });
        const div = document.createElement("div");
        div.className = "df-body";
        div.innerHTML = `<span class="role-tag">${n.role}</span><strong>${n.title}</strong><code>${n.kernel}</code>`;
        fo.append(div);
        grp.append(fo);

        grp.addEventListener("click", () => {
          selectItem(graph, "node", n.id);
        });
        gNodes.append(grp);
      });

      selectItem(graph, null, null);
    }

    document.querySelectorAll("[data-scene]").forEach(b => {
      b.addEventListener("click", () => {
        currentScene = b.dataset.scene;
        renderGraph();
      });
    });
    document.getElementById("btn-reset").addEventListener("click", () => {
      const graph = buildSceneGraph(currentScene);
      selectItem(graph, null, null);
    });
    document.getElementById("det-code-btn").addEventListener("click", () => {
      if (window.parent && typeof window.parent.openCodeDrawer === "function") {
        window.parent.openCodeDrawer(currentSnippet);
      }
    });

    renderGraph();
  </script>
</body>
</html>
