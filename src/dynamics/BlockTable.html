<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KVCache Storage Block Interleave Visualizer</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #1e293b;
      --highlight: #fff3c4;
      --accent: #ef4444;
      --brand: #0369a1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      max-width: 1220px;
      margin: 0 auto;
      padding: 12px 16px 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 310px 260px 1fr;
      gap: 16px;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #dbe4ef;
      border-radius: 8px;
      background: #f8fafc;
    }

    .control {
      display: grid;
      gap: 4px;
      font-size: 12px;
    }

    .control label {
      font-weight: 700;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
    }

    .control .value {
      font-size: 12px;
      color: var(--brand);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .control input[type="range"] {
      width: 100%;
      height: 22px;
      accent-color: var(--brand);
      cursor: pointer;
    }

    .tick-marks {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--muted);
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: center;
      justify-content: flex-end;
      font-size: 12.5px;
      color: #334155;
      white-space: nowrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 22px;
      height: 12px;
      border: 1px solid var(--line);
      background: var(--highlight);
    }

    .swatch.red {
      border: 2px solid var(--accent);
      background: transparent;
      border-radius: 4px;
    }

    .diagram-wrap {
      overflow-x: auto;
      border: 1px solid #dbe4ef;
      border-radius: 8px;
      background: #fff;
      padding: 8px 6px;
      line-height: 0;
    }

    svg {
      display: block;
      width: 100%;
      max-width: 1140px;
      height: auto;
      margin: 0 auto;
      background: white;
    }

    .panel-box {
      fill: #fff;
      stroke: var(--line);
      stroke-width: 1.2;
    }

    .panel-title {
      font-size: 19px;
      font-weight: 700;
      text-anchor: middle;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
    }

    .rank-label {
      font-size: 12.5px;
      font-weight: 700;
      text-anchor: middle;
      fill: #111827;
    }

    .axis-label {
      font-size: 12.5px;
      fill: #111827;
    }

    .small-label {
      font-size: 12px;
      fill: #111827;
    }

    .note-red {
      fill: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .cell {
      fill: #fff;
      stroke: #111827;
      stroke-width: 0.9;
    }

    .cell.group0 { fill: #fff2cc; }
    .cell.group1 { fill: #dbeafe; }
    .cell.group2 { fill: #dcfce7; }
    .cell.group3 { fill: #f3e8ff; }
    .cell.group4 { fill: #ffedd5; }
    .cell.group5 { fill: #fee2e2; }
    .cell.group6 { fill: #e0f2fe; }
    .cell.group7 { fill: #ecfccb; }

    .token-text {
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #111827;
    }

    .arrow {
      fill: none;
      stroke: #111827;
      stroke-width: 1.3;
      marker-end: url(#arrow);
    }

    .dash {
      fill: none;
      stroke: #4b5563;
      stroke-dasharray: 3 4;
      stroke-width: 1.1;
      marker-end: url(#arrow);
    }

    .brace {
      fill: none;
      stroke: #111827;
      stroke-width: 1.2;
    }

    .highlight-box {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      rx: 8;
      ry: 8;
    }

    .virtual-outline {
      fill: none;
      stroke: #111827;
      stroke-width: 1.2;
      rx: 15;
      ry: 15;
    }

    .caption {
      font-size: 12.5px;
      font-weight: 600;
      text-anchor: middle;
      fill: #111827;
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="controls">
      <div class="control">
        <label for="interleaveLevel">
          <span>Block interleave size (block_size=16 因数)</span>
          <span class="value"><span id="interleaveSizeVal">4</span> tokens</span>
        </label>
        <input id="interleaveLevel" type="range" min="0" max="4" step="1" value="2" />
        <div class="tick-marks"><span>1</span><span>2</span><span>4</span><span>8</span><span>16</span></div>
      </div>

      <div class="control">
        <label for="numTokens">
          <span>展示 token 数</span>
          <span class="value" id="numTokensVal">64</span>
        </label>
        <input id="numTokens" type="range" min="16" max="128" step="8" value="64" />
        <div class="tick-marks"><span>16</span><span>64</span><span>128</span></div>
      </div>

      <div class="legend">
        <span class="legend-item"><code>block_size % interleave_size == 0</code></span>
        <span class="legend-item"><span class="swatch"></span>已映射 token</span>
        <span class="legend-item"><span class="swatch red"></span>当前 interleave 粒度</span>
      </div>
    </div>

    <div class="diagram-wrap">
      <svg id="diagram" viewBox="0 0 1120 385" role="img" aria-label="KVCache Storage block interleave visualizer">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#111827"></path>
          </marker>
        </defs>
      </svg>
    </div>
  </div>

  <script>
    const svg = document.getElementById("diagram");
    const interleaveLevelEl = document.getElementById("interleaveLevel");
    const numTokensEl = document.getElementById("numTokens");

    const NS = "http://www.w3.org/2000/svg";
    const CP_SIZE = 4;
    const BLOCK_SIZE = 16;
    const DIVISORS = [1, 2, 4, 8, 16];

    function el(tag, attrs = {}, children = []) {
      const node = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "text") node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const child of children) node.appendChild(child);
      return node;
    }

    function text(x, y, value, cls = "small-label", anchor = null) {
      const attrs = { x, y, class: cls, text: value };
      if (anchor) attrs["text-anchor"] = anchor;
      return el("text", attrs);
    }

    function multilineText(x, y, lines, cls = "small-label", lineHeight = 14, anchor = "middle") {
      const t = el("text", { x, y, class: cls, "text-anchor": anchor });
      lines.forEach((line, i) => {
        t.appendChild(el("tspan", { x, dy: i === 0 ? 0 : lineHeight, text: line }));
      });
      return t;
    }

    function clearSvg() {
      [...svg.children].forEach((child) => {
        if (child.tagName.toLowerCase() !== "defs") child.remove();
      });
    }

    function addPanel(x, y, w, h, title, subtitle) {
      svg.appendChild(el("rect", { x, y, width: w, height: h, class: "panel-box" }));
      if (subtitle) svg.appendChild(text(x + w / 2, y - 14, subtitle, "panel-title"));
      svg.appendChild(text(x + w / 2, y + 24, title, "section-title"));
    }

    function drawBrace(x, y1, y2, label) {
      const mid = (y1 + y2) / 2;
      const d = `M ${x} ${y1} C ${x+10} ${y1}, ${x+10} ${y1+8}, ${x+10} ${y1+12}
                 L ${x+10} ${mid-12}
                 C ${x+10} ${mid-4}, ${x+18} ${mid-4}, ${x+18} ${mid}
                 C ${x+18} ${mid+4}, ${x+10} ${mid+4}, ${x+10} ${mid+12}
                 L ${x+10} ${y2-12}
                 C ${x+10} ${y2-8}, ${x+10} ${y2}, ${x} ${y2}`;
      svg.appendChild(el("path", { d, class: "brace" }));
      svg.appendChild(text(x + 32, mid + 4, label, "axis-label"));
    }

    function drawRankColumns({ x, y, rows, cellW, cellH, gap, tokensByRank, colorByGroup = true, highlightRows = 0 }) {
      for (let r = 0; r < CP_SIZE; r++) {
        const colX = x + r * (cellW + gap);
        svg.appendChild(text(colX + cellW / 2, y - 12, `rank${r}`, "rank-label"));

        const tokens = tokensByRank[r] || [];
        for (let row = 0; row < rows; row++) {
          const token = tokens[row];
          let cls = "cell";
          if (token) cls += colorByGroup ? ` group${Math.floor(token.group ?? 0) % 8}` : " filled";

          svg.appendChild(el("rect", {
            x: colX, y: y + row * cellH,
            width: cellW, height: cellH,
            class: cls
          }));

          if (token) {
            svg.appendChild(text(
              colX + cellW / 2,
              y + row * cellH + cellH / 2 + 1,
              token.label ?? `tok${token.id}`,
              "token-text"
            ));
          }
        }

        if (highlightRows > 0 && r === 0) {
          svg.appendChild(el("rect", {
            x: colX - 5,
            y: y - 5,
            width: cellW + 10,
            height: Math.min(highlightRows, rows) * cellH + 10,
            class: "highlight-box"
          }));
        }
      }
    }

    function buildOverviewRows(numBlocks) {
      const rows = Array.from({ length: CP_SIZE }, () => []);
      for (let r = 0; r < CP_SIZE; r++) {
        for (let b = 0; b < 9; b++) {
          rows[r].push({
            label: b < numBlocks ? `B${b}` : "",
            id: b,
            group: b
          });
        }
      }
      return rows;
    }

    function buildBlockInterleave(interleaveSize, numTokens) {
      const ranks = Array.from({ length: CP_SIZE }, () => []);
      for (let t = 0; t < numTokens; t++) {
        const group = Math.floor(t / interleaveSize);
        const r = group % CP_SIZE;
        ranks[r].push({ id: t, group });
      }
      return ranks;
    }

    function drawOverview(numTokens) {
      addPanel(10, 8, 430, 360, "Block Table (Physical Blocks)", null);

      const x = 82;
      const y = 78;
      const cellW = 54;
      const cellH = 23;
      const gap = 28;
      const rows = 12;
      const numBlocks = Math.ceil(numTokens / (BLOCK_SIZE * CP_SIZE));

      drawRankColumns({
        x, y, rows, cellW, cellH, gap,
        tokensByRank: buildOverviewRows(numBlocks),
        colorByGroup: true,
        highlightRows: 0
      });

      svg.appendChild(text(28, y + 145, "block", "axis-label"));

      const outlineX = x - 16;
      const outlineY = y - 5;
      const outlineW = CP_SIZE * cellW + (CP_SIZE - 1) * gap + 32;
      const outlineH = cellH + 10;
      svg.appendChild(el("rect", {
        x: outlineX,
        y: outlineY,
        width: outlineW,
        height: outlineH,
        class: "virtual-outline"
      }));

      const sourceX = outlineX + outlineW;
      const sourceY = outlineY + outlineH / 2;

      svg.appendChild(multilineText(sourceX + 18, y - 28, ["virtual", "block"], "section-title", 18, "start"));

      svg.appendChild(el("path", {
        d: `M ${sourceX} ${sourceY} L 525 18`,
        class: "arrow"
      }));
      svg.appendChild(el("path", {
        d: `M ${sourceX} ${sourceY} L 525 352`,
        class: "arrow"
      }));
      svg.appendChild(el("path", {
        d: `M ${sourceX} ${sourceY} L 525 155`,
        class: "dash"
      }));
    }

    function drawBlockPanel(interleaveSize, numTokens) {
      const x0 = 530;
      const y0 = 8;
      const w = 560;
      const h = 360;

      addPanel(x0, y0, w, h, "Virtual Block (64 Tokens = 4 × block_size 16)", null);

      svg.appendChild(multilineText(x0 + 16, y0 + 26, ["cp_kv_cache", "_interleave_size"], "note-red", 13, "start"));

      const x = x0 + 90;
      const y = y0 + 48;
      const cellW = 70;
      const cellH = 18;
      const gap = 20;
      const rows = 16;

      drawRankColumns({
        x, y, rows, cellW, cellH, gap,
        tokensByRank: buildBlockInterleave(interleaveSize, numTokens),
        colorByGroup: true,
        highlightRows: interleaveSize
      });

      drawBrace(x + CP_SIZE * cellW + (CP_SIZE - 1) * gap + 14, y, y + rows * cellH, "block");
      svg.appendChild(text(x0 + w / 2, y + rows * cellH + 15, "target_dcp_rank = floor(token_id / interleave_size) % DCP_size", "caption"));
    }

    function render() {
      const interleaveSize = DIVISORS[Number(interleaveLevelEl.value)] || 4;
      const numTokens = Number(numTokensEl.value);

      document.getElementById("interleaveSizeVal").textContent = interleaveSize;
      document.getElementById("numTokensVal").textContent = numTokens;

      clearSvg();
      drawOverview(numTokens);
      drawBlockPanel(interleaveSize, numTokens);
    }

    [interleaveLevelEl, numTokensEl].forEach((node) => {
      node.addEventListener("input", render);
      node.addEventListener("change", render);
    });

    render();
  </script>
</body>
</html>
