<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">Step 1 · 收集完整 Query Heads</text>
<text x="205.0" y="109.7" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">本地 Query Heads</text>
<text x="205.0" y="130.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">[B, H_local, D]</text>
<text x="205.0" y="151.3" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="205.0" y="172.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">新 Token KV 写入对应 Owner 卡</text>
<text x="205.0" y="264.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">_dcp_all_gather_fragments</text>
<text x="205.0" y="283.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">跨 DCP Gather 完整 Q Heads</text>
<text x="205.0" y="303.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">→ [B, H_full, D]</text>
<text x="205.0" y="322.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="205.0" y="342.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(DCP==PCP 或 Q Replicate 时免通信)</text>
<text x="441.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">Step 2 · 各卡对本地 1/DCP KV 算局部 Attention</text>
<text x="665.0" y="132.6" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 0 · 本地 1/DCP 历史 KV 分片</text>
<text x="665.0" y="153.4" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">KV Cache 静止不动 (零 KV 通信!)</text>
<text x="665.0" y="174.2" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">计算局部输出 (O_0, FP32 LSE_0)</text>
<text x="665.0" y="297.6" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 1 · 本地 1/DCP 历史 KV 分片</text>
<text x="665.0" y="318.4" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">KV Cache 静止不动 (零 KV 通信!)</text>
<text x="665.0" y="339.2" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">计算局部输出 (O_1, FP32 LSE_1)</text>
<text x="961.0" y="53.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">Step 3 · dcp_a2a_fused 无损打包归并</text>
<text x="1160.0" y="121.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">dcp_a2a_fused (Triton + All-to-All)</text>
<text x="1160.0" y="141.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1160.0" y="160.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Triton 无损打包 O_j + FP32 LSE_j</text>
<text x="1160.0" y="180.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 单次 all_to_all_single 按 Head 切分</text>
<text x="1160.0" y="199.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• LSE 权重归并: w_j = exp(L_j - max L)</text>
<text x="1160.0" y="292.2" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">归并后精确 Attention 输出</text>
<text x="1160.0" y="313.0" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">[B, H_local, D]</text>
<text x="1160.0" y="333.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">↓</text>
<text x="1160.0" y="354.6" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">O-Projection 写回残差流</text>
</svg>