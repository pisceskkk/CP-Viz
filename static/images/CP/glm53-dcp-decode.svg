<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">Step 1 · Query 收集与本地 Top-K 映射</text>
<text x="205.0" y="110.1" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">1. Query Heads Gather</text>
<text x="205.0" y="130.9" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">q_b_proj + W_UK_T 吸收 (D=512)</text>
<text x="205.0" y="151.7" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">凑齐完整 64 个 Q Heads</text>
<text x="205.0" y="259.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">2. KPool &amp; sparse_index_remap</text>
<text x="205.0" y="278.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="205.0" y="298.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Replicated KPool 选出全局 Top-2051</text>
<text x="205.0" y="317.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">↓</text>
<text x="205.0" y="337.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Triton 过滤映射为本卡 DCP KV 页索引</text>
<text x="441.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">Step 2 · 各卡对本地 1/DCP KV 算局部注意力</text>
<text x="665.0" y="132.6" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 0 · 本地 1/2 历史 KV 分片</text>
<text x="665.0" y="153.4" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">npu_sparse_flash_attn (KV 免通信!)</text>
<text x="665.0" y="174.2" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">产出局部 (O_0, FP32 LSE_0)</text>
<text x="665.0" y="297.6" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 1 · 本地 1/2 历史 KV 分片</text>
<text x="665.0" y="318.4" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">npu_sparse_flash_attn (KV 免通信!)</text>
<text x="665.0" y="339.2" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">产出局部 (O_1, FP32 LSE_1)</text>
<text x="961.0" y="53.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">Step 3 · dcp_a2a_fused 无损打包归并</text>
<text x="1160.0" y="116.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">dcp_a2a_fused (Triton + All-to-All)</text>
<text x="1160.0" y="136.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1160.0" y="155.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 打包 BF16 O_j + FP32 LSE_j (INT32/Base256)</text>
<text x="1160.0" y="175.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 单次 all_to_all_single 按 Head 切分</text>
<text x="1160.0" y="194.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• LSE 权重归并: w_j = exp(L_j - max L)</text>
<text x="1160.0" y="289.7" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">W_UV + ParallelOProjection</text>
<text x="1160.0" y="310.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1160.0" y="331.3" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">恢复 v_head_dim = 256</text>
<text x="1160.0" y="352.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">投影回 [T_mtp, 4096] 进 MoE</text>
</svg>