<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#0369a1" text-anchor="start">Step 1 · 本地 1/PCP 序列 QKV 投影</text>
<text x="210.0" y="126.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">PCP 本地输入激活</text>
<text x="210.0" y="145.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">[T_local, H] (T_local = T_global / PCP)</text>
<text x="210.0" y="165.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">包含 Head Segment + Tail Segment</text>
<text x="210.0" y="279.7" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">本地 Q / K / V 投影</text>
<text x="210.0" y="300.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="210.0" y="321.3" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">• Q_local [T_local, ...]</text>
<text x="210.0" y="342.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">• KV_local [T_local, ...]</text>
<text x="446.0" y="53.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">Step 2 · 跨 PCP AllGather 新 KV 并写入 Cache</text>
<text x="672.5" y="121.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">pcp_group.all_gather(KV_local)</text>
<text x="672.5" y="140.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="672.5" y="160.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">收集所有 PCP Rank 在当前步产生的新 KV</text>
<text x="672.5" y="179.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">汇聚为 [PCP × T_local_padded, ...]</text>
<text x="672.5" y="286.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">按 gathered_kv_slot_mappings 写入 KV Cache</text>
<text x="672.5" y="305.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="672.5" y="325.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 索引经 padded_gather_idx 重排对齐 Gather 缓冲区</text>
<text x="672.5" y="344.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• ~gathered_kv_write_mask 自动置 -1 过滤 Padding</text>
<text x="966.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">Step 3 · 本地 Query 对完整 KV 算因果 Attention</text>
<text x="1162.5" y="121.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Causal Attention (普通 / Chunked / APC)</text>
<text x="1162.5" y="141.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1162.5" y="160.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Query: 仅算本卡 Q_local (1/PCP 算力!)</text>
<text x="1162.5" y="180.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Key/Value: 历史 Prefix KV + 当前步完整新 KV</text>
<text x="1162.5" y="199.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  (Head 段与 Tail 段按各自真实 positions 掩码)</text>
<text x="1162.5" y="303.6" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">O-Projection &amp; MLP / MoE</text>
<text x="1162.5" y="323.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">保持在 [T_local, H] 本地视图逐层前传</text>
<text x="1162.5" y="342.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">末层结束后调 restore_for_sampling 恢复全局顺序</text>
</svg>