<text x="127.5" y="179.3" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">PCP 本地输入</text>
<text x="127.5" y="200.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">[T_pcp, 4096]</text>
<text x="127.5" y="220.9" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">(仅 1/PCP Tokens)</text>
<text x="127.5" y="241.7" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="127.5" y="262.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">HC_pre 归一化</text>
<text x="281.0" y="48.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">支路 A · 34 层 KDA 线性注意力 (kda.py) — 必须还原因果顺序推进 SSM 状态</text>
<text x="415.0" y="109.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">1. PCP AllGather + 还原</text>
<text x="415.0" y="128.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">all_gather()[restore_idx]</text>
<text x="415.0" y="148.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">恢复 [T_global, 4096]</text>
<text x="707.5" y="109.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">2. TP×PCP Head 分片推进</text>
<text x="707.5" y="128.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">in_proj + Conv1d + chunk_kda</text>
<text x="707.5" y="148.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅算 n = 64/(TP×PCP) Heads</text>
<text x="990.0" y="109.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">3. ReduceScatter 切回</text>
<text x="990.0" y="128.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">out[padded_gather_idx]</text>
<text x="990.0" y="148.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">一步归约回 [T_pcp, 4096]</text>
<text x="281.0" y="258.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">支路 B · 11 层 NoPE SFA + KPool (indexer_kpool.py &amp; sfa_cp.py) — 异步重叠 + 本地 Query</text>
<text x="415.0" y="311.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">1. 异步 Gather Key 重叠</text>
<text x="415.0" y="331.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">all_gather_async(k_hidden)</text>
<text x="415.0" y="350.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">与本地 wq_b / q_b_proj 并行!</text>
<text x="415.0" y="370.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">还原顺序更新 4:1 KPool</text>
<text x="707.5" y="311.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">2. 本地 TopK &amp; 主 KV 同步</text>
<text x="707.5" y="331.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• KPool 选本地 [T_pcp, 2051]</text>
<text x="707.5" y="350.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Latent KV (512) 跨 PCP Gather</text>
<text x="707.5" y="370.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  写入缓存 (含 Prefix Cache)</text>
<text x="990.0" y="311.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">3. 本地 1/PCP 稀疏注意力</text>
<text x="990.0" y="331.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">npu_sparse_flash_attn</text>
<text x="990.0" y="350.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅算 T_pcp 个 Query</text>
<text x="990.0" y="370.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">→ W_UV + ParallelOProj</text>
<text x="1270.0" y="181.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">HC_post + EP MoE</text>
<text x="1270.0" y="201.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">保持 [T_pcp, 4096]</text>
<text x="1270.0" y="220.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1270.0" y="240.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">末层 L44 出口调</text>
<text x="1270.0" y="259.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">restore_for_sampling</text>
</svg>