<text x="111.0" y="53.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">STAGE 1 · 当前步新 KV 落盘与历史 KV 收集</text>
<text x="521.0" y="53.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">STAGE 2 · 分块迭代计算 Current &amp; Context Attention</text>
<text x="966.0" y="53.0" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">STAGE 3 · LSE 修正合并 (correct_attn) 与输出</text>
<text x="187.5" y="150.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">QKV Linear</text>
<text x="187.5" y="169.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(当前步 Chunk)</text>
<text x="187.5" y="310.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Local KV Cache</text>
<text x="187.5" y="329.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(1/DCP 历史块)</text>
<text x="390.0" y="301.7" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">AllGather KV</text>
<text x="390.0" y="319.9" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">(跨 DCP 收集历史块</text>
<text x="390.0" y="338.1" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">还原连续顺序)</text>
<text x="637.5" y="130.4" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Current Attention</text>
<text x="637.5" y="149.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(Q_cur × KV_cur)</text>
<text x="637.5" y="297.7" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Context Attention</text>
<text x="637.5" y="315.9" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">(Q_cur × Full Context KV)</text>
<text x="637.5" y="334.1" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">按 Workspace 分块迭代</text>
<text x="754.0" y="271.0" font-size="11" font-weight="600" fill="#334155" text-anchor="start">分块 Workspace 循环:</text>
<text x="754.0" y="285.3" font-size="11" font-weight="600" fill="#334155" text-anchor="start">for chunk_i in ctx_kv:</text>
<text x="754.0" y="299.6" font-size="11" font-weight="600" fill="#334155" text-anchor="start">  AllGather(chunk_i)</text>
<text x="754.0" y="313.9" font-size="11" font-weight="600" fill="#334155" text-anchor="start">  O_i, lse_i = Attn(Q, chunk_i)</text>
<text x="754.0" y="328.2" font-size="11" font-weight="600" fill="#334155" text-anchor="start">  O_ctx = correct_attn(...)</text>
<text x="1072.5" y="204.7" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">correct_attn</text>
<text x="1072.5" y="222.9" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">合并 Current 与 Context</text>
