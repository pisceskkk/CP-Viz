<text x="46.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">1 · 逻辑 Virtual Block (block_size × DCP)</text>
<text x="240.0" y="112.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 0 (0 .. I-1)       →  DCP Rank 0</text>
<text x="240.0" y="189.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 1 (I .. 2I-1)      →  DCP Rank 1</text>
<text x="240.0" y="266.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 2 (2I .. 3I-1)     →  DCP Rank 0</text>
<text x="240.0" y="343.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 3 (3I .. 4I-1)     →  DCP Rank 1</text>
<text x="635.0" y="168.9" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">compute_slot_mappings</text>
<text x="635.0" y="189.7" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">(Triton Kernel)</text>
<text x="635.0" y="210.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="635.0" y="231.3" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">owner = (offset // I) % DCP</text>
<text x="635.0" y="252.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">• 归属本卡 → 物理 Slot ID</text>
<text x="635.0" y="272.9" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">• 非归属卡 → PAD_SLOT (-1)</text>
<text x="836.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">2 · 各卡物理 KV Cache 落盘 (默认切分所有 Attention KV)</text>
<text x="1095.0" y="107.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 0 物理 Block</text>
<text x="1095.0" y="127.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Slot Mapping: [Slot_0, -1, Slot_1, -1]</text>
<text x="1095.0" y="146.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅写入偶数交错块 (Chunk 0, 2, ...) → 显存占用 1/DCP</text>
<text x="1095.0" y="224.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 1 物理 Block</text>
<text x="1095.0" y="244.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Slot Mapping: [-1, Slot_0, -1, Slot_1]</text>
<text x="1095.0" y="263.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅写入奇数交错块 (Chunk 1, 3, ...) → 显存占用 1/DCP</text>
<text x="1095.0" y="335.2" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">AttentionSpec 默认 dcp_sharded = True</text>
<text x="1095.0" y="353.4" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">所有 Attention KV Cache (Full Attention、MLA/SFA 主 KV 及 Indexer)</text>
<text x="1095.0" y="371.6" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">默认均按 DCP 切分；非序列增长状态 (如 Mamba) 可按 Group 设为 False</text>
</svg>