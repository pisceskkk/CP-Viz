<text x="46.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">1 · 逻辑 Virtual Block (128 × DCP)</text>
<text x="235.0" y="112.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Block 0 (pos 0..127)  →  DCP Rank 0</text>
<text x="235.0" y="189.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Block 1 (pos 128..255) →  DCP Rank 1</text>
<text x="235.0" y="266.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Block 2 (pos 256..383) →  DCP Rank 0</text>
<text x="235.0" y="343.4" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Block 3 (pos 384..511) →  DCP Rank 1</text>
<text x="630.0" y="179.3" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">compute_slot_mappings</text>
<text x="630.0" y="200.1" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">(Triton Kernel)</text>
<text x="630.0" y="220.9" font-size="16" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="630.0" y="241.7" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">owner = (pos // 128) % DCP</text>
<text x="630.0" y="262.5" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">非归属 Rank 写 PAD (-1)</text>
<text x="836.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">2 · GLM-5.3-Flash 异构 Cache 落盘契约</text>
<text x="1095.0" y="111.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Group 0 · SFA 主 KV Cache (512维 Latent)</text>
<text x="1095.0" y="130.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">dcp_sharded = True (交错分片 1/DCP)</text>
<text x="1095.0" y="150.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Rank 0: [Slot, -1, Slot, -1]  |  Rank 1: [-1, Slot, -1, Slot]</text>
<text x="1095.0" y="237.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Group 0/1 · KPool (4:1 压缩池) &amp; FP32 Tail Ring</text>
<text x="1095.0" y="256.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">dcp_sharded = False (全卡复制，零通信选全局 Top-2051)</text>
<text x="1095.0" y="342.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Group 2~4 · 34层 KDA Conv &amp; Recurrent State</text>
<text x="1095.0" y="361.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">dcp_sharded = False (按请求槽位索引，Heads 按 TP×PCP 切分)</text>
