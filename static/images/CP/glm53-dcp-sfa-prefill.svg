<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="start">1 · KPool 稀疏索引器双模式 (选 Top-2051)</text>
<text x="350.0" y="123.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">模式 A：Replicated KPool Indexer (GLM-5.3-Flash 默认)</text>
<text x="350.0" y="143.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="350.0" y="162.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 4:1 池化压缩后每 Token 仅 32 Elements (主 KV 的 ~1/16)</text>
<text x="350.0" y="182.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 全卡复制 KPool + Tail Cache → 零跨卡通信直接选出全局 Top-2051!</text>
<text x="350.0" y="286.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">模式 B：Sharded Indexer (可选显存优化)</text>
<text x="350.0" y="305.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="350.0" y="325.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Indexer Cache 同样按 DCP 分片 → 各卡先选出本地候选 [T, 1, K_local]</text>
<text x="350.0" y="344.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 跨 DCP AllGather 候选 + Triton 稳定基数排序 (Radix Sort) 归并 Top-K</text>
<text x="731.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">2 · SFA 主 KV (512维) Prefill 紧凑块收集</text>
<text x="880.0" y="116.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 1: 写入本地归属 Slot</text>
<text x="880.0" y="135.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">reshape_and_cache_sfa</text>
<text x="880.0" y="155.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅 (pos//128)%DCP == rank</text>
<text x="880.0" y="174.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">写入本卡 HBM</text>
<text x="1205.0" y="116.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 2: 紧凑块 AllGather</text>
<text x="1205.0" y="135.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">_record_dcp_kv_gather</text>
<text x="1205.0" y="155.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">仅对活跃块 kv_gather_block_ids</text>
<text x="1205.0" y="174.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">跨 DCP AllGather 拼接</text>
<text x="1045.0" y="286.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 3: npu_sparse_flash_attn (Prefill / Chunked Prefill)</text>
<text x="1045.0" y="305.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1045.0" y="325.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">使用 Compact Block Table 寻址聚合后的 (历史 Prefix + 当前 Chunk) KV</text>
<text x="1045.0" y="344.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">结合左侧选出的 Top-2051 稀疏索引完成注意力计算</text>
</svg>