<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#0369a1" text-anchor="start">1 · Full Attention / Dense MLA：分块 AllGather 历史 KV</text>
<text x="350.0" y="119.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 1: 当前 Chunk 新 KV 写入本地归属 DCP Slot</text>
<text x="350.0" y="138.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(非归属 Token 写 -1，各卡仅存 1/DCP 历史与当前块)</text>
<text x="350.0" y="231.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 2: 分块 Workspace AllGather 历史 Cached KV</text>
<text x="350.0" y="250.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">按 lcm(block_size, I × DCP) 划窗，跨 DCP 收集并按 kv_rank_offsets 还原顺序</text>
<text x="350.0" y="350.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Step 3: 拼接连续 KV 计算因果 Prefill Attention (或与本地 Q 做 LSE 合并)</text>
<text x="731.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">2 · Sparse Attention (SFA)：主 KV 与 Indexer Cache 协同</text>
<text x="1045.0" y="131.2" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">• Sharded Indexer + Sharded 主 KV (默认全切分)</text>
<text x="1045.0" y="150.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  Indexer Cache 与主 KV 均按相同 DCP Token Owner 切分 (1/DCP)</text>
<text x="1045.0" y="170.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  各卡选出本地候选 [T, 1, K_local] → Triton 基数排序跨卡归并 Top-K</text>
<text x="1045.0" y="298.6" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">• Replicated Indexer + Sharded 主 KV (压缩 Indexer 优化)</text>
<text x="1045.0" y="318.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  当 Indexer 采用高倍池化压缩 (如 4:1 KPool) 时，Indexer Cache 可全卡复制</text>
<text x="1045.0" y="337.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  零通信直出全局 Top-K；Prefill 写完主 KV 后按紧凑块表 AllGather 活跃 KV 块</text>
</svg>