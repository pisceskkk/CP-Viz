<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">1 · PCP Decode 请求调度：状态锁步 vs 轮询分片</text>
<text x="285.0" y="116.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">GLM-5.3-Flash / KPool 模型：Replicated Decode</text>
<text x="285.0" y="136.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="285.0" y="155.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 34 层 KDA 的 64 个 Head 状态分散在 TP×PCP 各卡上</text>
<text x="285.0" y="175.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Decode 请求在各 PCP Rank 保持相同顺序复制</text>
<text x="285.0" y="194.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 每卡零通信锁步推进本地 1/(TP×PCP) KDA 状态 + 1/DCP SFA KV!</text>
<text x="285.0" y="291.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">纯 MLA 模型 (PCP&gt;1, DCP=1)：Decode Request Sharding</text>
<text x="285.0" y="310.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="285.0" y="330.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 无 KDA/Mamba 状态约束时，按 decode_ordinal % PCP 轮询分配请求</text>
<text x="285.0" y="349.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 各卡仅算 1/PCP Decode 请求，跨 PCP AllGather 新 KV</text>
<text x="596.0" y="53.0" font-size="16" font-weight="700" fill="#0369a1" text-anchor="start">2 · 利用 PCP Rank 联合切分四大常驻权重 (大幅降低单卡 HBM)</text>
<text x="785.0" y="121.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">① VocabEmbedding (默认开启)</text>
<text x="785.0" y="140.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="785.0" y="160.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">按 TP × PCP 联合切分词表</text>
<text x="785.0" y="179.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">[154880 / (TP×PCP), 4096]</text>
<text x="1170.0" y="121.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">② 34层 KDA 权重 &amp; 状态 (核心!)</text>
<text x="1170.0" y="140.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1170.0" y="160.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">PCPColumn / PCPRowParallel</text>
<text x="1170.0" y="179.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">64 Heads &amp; SSM State / (TP×PCP)</text>
<text x="785.0" y="291.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">③ 11层 SFA ParallelOProj</text>
<text x="785.0" y="310.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="785.0" y="330.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">enable_pcp_o_proj_weight_sharding</text>
<text x="785.0" y="349.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">o_proj 权重沿 TP × PCP 切分</text>
<text x="1170.0" y="291.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">④ ParallelLMHead (默认开启)</text>
<text x="1170.0" y="310.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1170.0" y="330.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">按 TP × PCP 联合切分输出头</text>
<text x="1170.0" y="349.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">[154880 / (TP×PCP), 4096]</text>
</svg>