<text x="41.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">1 · PCP Decode 两种请求调度模式</text>
<text x="292.5" y="116.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">模式 A：Decode Request Sharding (PCP &gt; 1, DCP = 1)</text>
<text x="292.5" y="136.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="292.5" y="155.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 按 target_rank = decode_ordinal % PCP 轮询分配 Decode 请求</text>
<text x="292.5" y="175.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  (MTP 下同一请求的 K+1 个验证 Token 绑定在同一 Rank)</text>
<text x="292.5" y="194.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 各卡仅计算 1/PCP Decode 请求，跨 PCP AllGather 新 KV 落盘</text>
<text x="292.5" y="291.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">模式 B：Replicated Decode (当叠加 DCP &gt; 1 或含跨卡切分状态)</text>
<text x="292.5" y="310.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="292.5" y="330.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Decode 请求在所有 PCP Rank 上按相同顺序复制</text>
<text x="292.5" y="349.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 由 DCP 切分历史 KV Cache 并通过 dcp_a2a_fused 归并局部注意力</text>
<text x="611.0" y="53.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">2 · 利用 PCP Rank 分摊常驻权重显存 (TP × PCP Weight Sharding)</text>
<text x="985.0" y="119.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">① Embedding &amp; LM Head 跨 TP × PCP 联合切分 (默认开启)</text>
<text x="985.0" y="138.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">enable_pcp_embedding_lmhead_weight_sharding = True，适用于所有 Attention 后端</text>
<text x="985.0" y="231.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">② Attention O-Projection 跨 PCP 权重切分 (SFA / DSA 默认开启)</text>
<text x="985.0" y="250.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">enable_pcp_o_proj_weight_sharding = True：Prefill 临时 Gather 权重，Sharded Decode 交换激活</text>
<text x="985.0" y="341.4" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">③ 线性注意力层 (如 KDA) 投影权重与 SSM 状态跨 TP × PCP 切分</text>
<text x="985.0" y="360.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">PCPColumnParallelLinear / PCPRowParallelLinear 将 Heads 与状态扩维切分至 TP × PCP</text>
</svg>