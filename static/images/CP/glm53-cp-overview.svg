<text x="46.0" y="53.0" font-size="16" font-weight="700" fill="#0369a1" text-anchor="start">PCP · 算力切分 (切 Query 输入序列)</text>
<text x="240.0" y="104.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">长序列输入 Query [T_global]</text>
<text x="240.0" y="124.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">DualChunkSwap 头尾对称切分 (2P Chunks)</text>
<text x="145.0" y="204.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">PCP Rank 0</text>
<text x="145.0" y="224.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">Head 0 + Tail 3</text>
<text x="335.0" y="204.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">PCP Rank 1</text>
<text x="335.0" y="224.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">Head 1 + Tail 2</text>
<text x="240.0" y="313.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">核心目标：降低首字时延 TTFT</text>
<text x="240.0" y="333.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 扩展 World Size = PCP × TP</text>
<text x="240.0" y="352.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 各卡仅计算 1/PCP 本地 Query</text>
<text x="240.0" y="372.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 支持跨 PCP 切分常驻权重</text>
<text x="496.0" y="53.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">通信组拓扑 (parallel_state.py)</text>
<text x="700.0" y="107.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">物理 Rank 网格: (..., PCP, TP)</text>
<text x="700.0" y="127.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">rank = pcp_rank × TP + tp_rank</text>
<text x="700.0" y="207.7" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">DCP 复用 PCP / TP 进程组</text>
<text x="700.0" y="227.2" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">转置为 (TP, PCP) 后按 dcp_size 切分</text>
<text x="700.0" y="246.7" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">(优先跨 PCP 维度，再跨 TP 维度)</text>
<text x="700.0" y="323.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">职责正交解耦：</text>
<text x="700.0" y="343.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• PCP 负责切分输入序列计算与常驻权重</text>
<text x="700.0" y="362.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• DCP 负责切分 Attention KV Cache 显存</text>
<text x="700.0" y="382.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 两者可独立开启，也可 PCP + DCP 叠加</text>
<text x="966.0" y="53.0" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="start">DCP · 显存切分 (切 Attention KV Cache)</text>
<text x="1160.0" y="104.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Virtual Block 交错落盘 (Interleave I)</text>
<text x="1160.0" y="124.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">target_rank = (vblock_offset // I) % DCP</text>
<text x="1065.0" y="204.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 0</text>
<text x="1065.0" y="224.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">存 1/DCP KV 分片</text>
<text x="1255.0" y="204.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DCP Rank 1</text>
<text x="1255.0" y="224.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">非归属 Slot 写 -1</text>
<text x="1160.0" y="313.9" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">核心目标：扩容 KV &amp; 降低 Decode TPOT</text>
<text x="1160.0" y="333.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 默认切分所有 Attention KV Cache</text>
<text x="1160.0" y="352.9" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  (含 Full Attention、主 KV 与 Indexer)</text>
<text x="1160.0" y="372.4" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• Decode 局部 Attention + All2All LSE 归并</text>
