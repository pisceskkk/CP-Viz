<text x="41.0" y="48.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">1 · 长请求按 DualChunkSwap 切分为 2P 个对称 Chunk (以 PCP=2 → 4 Chunks 为例)</text>
<text x="200.0" y="97.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 0 (Head 0)</text>
<text x="200.0" y="117.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">浅因果三角 (计算量小)</text>
<text x="520.0" y="97.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 1 (Head 1)</text>
<text x="520.0" y="117.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">中浅因果梯形</text>
<text x="840.0" y="97.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 2 (Tail 1)</text>
<text x="840.0" y="117.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">中深因果梯形</text>
<text x="1177.5" y="97.0" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Chunk 3 (Tail 0)</text>
<text x="1177.5" y="117.8" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">深因果梯形 (计算量大)</text>
<text x="41.0" y="218.0" font-size="16" font-weight="700" fill="#0369a1" text-anchor="start">2 · MRV2 展开为 2x 独立虚拟请求段 (RankSegment)</text>
<text x="237.5" y="281.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">PCP Rank 0 (取 Chunk 0 &amp; 3)</text>
<text x="237.5" y="300.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="237.5" y="320.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 虚拟请求行 A: Chunk 0 (computed = 0)</text>
<text x="237.5" y="339.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 虚拟请求行 B: Chunk 3 (computed = 3L/4)</text>
<text x="237.5" y="359.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">总注意力面积 = 浅三角 + 深梯形 (完美均衡!)</text>
<text x="632.5" y="281.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">PCP Rank 1 (取 Chunk 1 &amp; 2)</text>
<text x="632.5" y="300.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="632.5" y="320.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 虚拟请求行 A: Chunk 1 (computed = L/4)</text>
<text x="632.5" y="339.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• 虚拟请求行 B: Chunk 2 (computed = 2L/4)</text>
<text x="632.5" y="359.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">总注意力面积与 Rank 0 完全相等!</text>
<text x="891.0" y="218.0" font-size="16" font-weight="700" fill="#15803d" text-anchor="start">3 · 双向互逆映射表 (_build_batch_layout)</text>
<text x="1125.0" y="281.1" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">• padded_gather_idx (Global → Gathered)</text>
<text x="1125.0" y="300.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  对齐 KV Cache Slot Mapping，用 write_mask 过滤 Pad</text>
<text x="1125.0" y="320.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle"></text>
<text x="1125.0" y="339.6" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">• hidden_restore_idx (Gathered → Global)</text>
<text x="1125.0" y="359.1" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">  从 AllGather 交错序列一键恢复 [0, 1, 2, 3] 全局顺序!</text>
</svg>